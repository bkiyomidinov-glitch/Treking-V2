    :root{--bg:#09090b;--panel:#111114;--panel2:#18181c;--line:#29292f;--text:#f4f3f5;--muted:#a09da5;--mint:#ff4655;--acid:#ff7b82;--red:#ff4655;--blue:#b1a3aa}

    .stat:after{border-color:#e12c3c2b}
    .panel{box-shadow:0 12px 34px #00000022;transition:border-color .22s,transform .22s,box-shadow .22s}
    .panel:hover{border-color:#493035;box-shadow:0 14px 40px #00000038}

    function openCatalogAttributeModal(product){
      $('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><form class="modal" id="catalog-attribute-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><strong id="modal-title">Атрибути нав</strong><div class="hint">${esc(product.name)} · ${esc(product.sku)}</div></div><button class="btn icon-btn btn-quiet" type="button" id="close-modal" aria-label="Пӯшидан">${icon('x',15)}</button></div><div class="modal-body"><div class="attribute-builder-grid"><div class="field"><label for="attribute-label">Номи атрибут</label><input class="input" id="attribute-label" maxlength="80" required placeholder="Масалан: Ҳаҷми моеъ"></div><div class="field"><label for="attribute-type">Навъи ҷавоб</label><select class="select" id="attribute-type"><option value="number">Рақам</option><option value="select">Интихоб аз рӯйхат</option><option value="text">Матн</option></select></div><div class="field"><label for="attribute-unit">Воҳиди ченак</label><input class="input" id="attribute-unit" maxlength="24" placeholder="см, мл, дона"></div><div class="field"><label for="attribute-default">Қимати пешфарз</label><input class="input" id="attribute-default" type="number" value="10"></div><div class="attribute-type-fields" id="attribute-number-fields"><div class="field"><label for="attribute-min">Ҳадди ақал</label><input class="input" id="attribute-min" type="number" value="0"></div><div class="field"><label for="attribute-max">Ҳадди аксар</label><input class="input" id="attribute-max" type="number" value="100"></div><div class="field"><label for="attribute-step">Қадам</label><input class="input" id="attribute-step" type="number" min="0.001" step="any" value="1"></div></div><div class="field full hidden" id="attribute-options-field"><label for="attribute-options">Имконот, бо вергул ҷудо кунед</label><input class="input" id="attribute-options" placeholder="Хурд, Миёна, Калон"></div></div></div><div class="modal-footer"><button class="btn btn-quiet" type="button" id="cancel-modal">Бекор кардан</button><button class="btn btn-primary" type="submit">${icon('save',14)} Нигоҳ доштан</button></div></form></div>`;
      refreshIcons();const close=()=>$('#modal-root').innerHTML='';$('#close-modal').addEventListener('click',close);$('#cancel-modal').addEventListener('click',close);$('#modal-backdrop').addEventListener('click',event=>{if(event.target.id==='modal-backdrop')close();});
      const type=$('#attribute-type'),defaultInput=$('#attribute-default');

    function openMdmModal(resource){

        if(resource==='vehicles'&&key==='refrigerated')return `<div class="field"><label>${esc(label)}</label><select class="select" name="${key}"><option value="false">Нест</option><option value="true">Ҳаст</option></select></div>`;

        return `<div class="field"><label>${esc(label)}</label><input class="input" name="${key}" type="${type}" ${numeric?'min="0.1" step="0.1"':''} ${resource==='product_catalog'&&key==='description'?'':'required'}></div>`;
      }).join('');
      const attributeEditor=resource==='product_catalog'?`<section class="attribute-builder"><div class="attribute-builder-head"><div><strong>Атрибутҳои маҳсулоти нав</strong><div class="hint">Атрибутҳоро пеш аз сабти мол илова кунед — мол ва саволҳояш якҷоя нигоҳ дошта мешаванд.</div></div><span class="scene-badge" id="attribute-count">0 / 20</span></div><div class="attribute-builder-grid"><div class="field"><label for="attribute-label">Номи атрибут</label><input class="input" id="attribute-label" maxlength="80" placeholder="Масалан: Ҳаҷми моеъ"></div><div class="field"><label for="attribute-type">Навъи ҷавоб</label><select class="select" id="attribute-type"><option value="number">Рақам</option><option value="select">Интихоб аз рӯйхат</option><option value="text">Матн</option></select></div><div class="field"><label for="attribute-unit">Воҳиди ченак</label><input class="input" id="attribute-unit" maxlength="24" placeholder="см, мл, дона"></div><div class="field" id="attribute-default-field"><label for="attribute-default">Қимати пешфарз</label><input class="input" id="attribute-default" type="number" value="10"></div><div class="attribute-type-fields" id="attribute-number-fields"><div class="field"><label for="attribute-min">Ҳадди ақал</label><input class="input" id="attribute-min" type="number" value="0"></div><div class="field"><label for="attribute-max">Ҳадди аксар</label><input class="input" id="attribute-max" type="number" value="100"></div><div class="field"><label for="attribute-step">Қадам</label><input class="input" id="attribute-step" type="number" min="0.001" step="any" value="1"></div></div><div class="field full hidden" id="attribute-options-field"><label for="attribute-options">Имконот, бо вергул ҷудо кунед</label><input class="input" id="attribute-options" placeholder="Хурд, Миёна, Калон"><span class="hint">Қимати пешфарз бояд яке аз ҳамин имконот бошад.</span></div><div class="attribute-builder-actions"><button class="btn btn-quiet" type="button" id="add-attribute">${icon('plus',14)} Иловаи атрибут</button></div></div><div class="attribute-list" id="attribute-list"><div class="hint">Ҳоло атрибути иловагӣ нест.</div></div></section>`:'';
      $('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><form class="modal" id="mdm-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><strong id="modal-title">Сабти нав · ${esc(resourceNames[resource])}</strong><button class="btn icon-btn btn-quiet" type="button" id="close-modal" aria-label="Пӯшидан">${icon('x',15)}</button></div><div class="modal-body"><div class="form-grid" style="padding:0">${inputs}</div>${attributeEditor}</div><div class="modal-footer"><button class="btn btn-quiet" type="button" id="cancel-modal">Бекор кардан</button><button class="btn btn-primary" type="submit">${icon('save',14)} Нигоҳ доштан</button></div></form></div>`;
      refreshIcons();const close=()=>$('#modal-root').innerHTML='';$('#close-modal').addEventListener('click',close);$('#cancel-modal').addEventListener('click',close);$('#modal-backdrop').addEventListener('click',event=>{if(event.target.id==='modal-backdrop')close();});
      if(resource==='product_catalog'){
        const type=$('#attribute-type'),defaultInput=$('#attribute-default');
        const toggleAttributeType=()=>{const numeric=type.value==='number';$('#attribute-number-fields').classList.toggle('hidden',!numeric);$('#attribute-options-field').classList.toggle('hidden',type.value!=='select');defaultInput.type=numeric?'number':'text';defaultInput.maxLength=numeric?-1:500;defaultInput.value=numeric?'10':type.value==='select'?($('#attribute-options').value.split(',').map(value=>value.trim()).filter(Boolean)[0]||''):'';};
        const renderAttributes=()=>{$('#attribute-count').textContent=`${customAttributes.length} / 20`;$(`#attribute-list`).innerHTML=customAttributes.length?customAttributes.map((attribute,index)=>`<div class="attribute-chip"><span><strong>${esc(attribute.label)}</strong><small>${esc(attribute.type)}${attribute.unit?` · ${esc(attribute.unit)}`:''}</small></span><button class="btn icon-btn btn-quiet" type="button" data-remove-attribute="${index}" aria-label="Нест кардани атрибут">${icon('x',13)}</button></div>`).join(''):'<div class="hint">Ҳоло атрибути иловагӣ нест.</div>';refreshIcons();};
        type.addEventListener('change',toggleAttributeType);$('#attribute-options').addEventListener('input',()=>{if(type.value==='select'&&!defaultInput.value.trim())defaultInput.value=$('#attribute-options').value.split(',').map(value=>value.trim()).filter(Boolean)[0]||'';});
        $('#add-attribute').addEventListener('click',()=>{const label=$('#attribute-label').value.trim();if(!label){toast('Номи атрибутро ворид кунед.',true);$('#attribute-label').focus();return;}if(customAttributes.length>=20){toast('Ба як маҳсулот то 20 атрибути иловагӣ илова кардан мумкин аст.',true);return;}const attributeType=type.value;const attribute={key:`attribute_${nextAttributeId++}`,label,type:attributeType,default:attributeType==='number'?Number(defaultInput.value):defaultInput.value.trim(),unit:$('#attribute-unit').value.trim()};if(attributeType==='number'){attribute.min_value=Number($('#attribute-min').value);attribute.max_value=Number($('#attribute-max').value);attribute.step=Number($('#attribute-step').value);if(!Number.isFinite(attribute.default)||!Number.isFinite(attribute.min_value)||!Number.isFinite(attribute.max_value)||!Number.isFinite(attribute.step)||attribute.max_value<=attribute.min_value||attribute.step<=0||attribute.default<attribute.min_value||attribute.default>attribute.max_value){toast('Қиматҳои ададӣ ва ҳудудҳоро дуруст ворид кунед.',true);return;}}if(attributeType==='select'){attribute.options=$('#attribute-options').value.split(',').map(value=>value.trim()).filter(Boolean);if(new Set(attribute.options).size<2||new Set(attribute.options).size!==attribute.options.length||!attribute.options.includes(attribute.default)){toast('На камтар аз ду имконоти гуногун ворид кунед ва пешфарзро аз рӯйхат интихоб кунед.',true);return;}}if(attributeType==='text'&&!attribute.default)attribute.default='';customAttributes.push(attribute);$('#attribute-label').value='';$('#attribute-unit').value='';renderAttributes();});
        $('#attribute-list').addEventListener('click',event=>{const button=event.target.closest('[data-remove-attribute]');if(!button)return;customAttributes.splice(Number(button.dataset.removeAttribute),1);renderAttributes();});
      }
      $('#mdm-form').addEventListener('submit',async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget));for(const key of ['capacity','distance_km','duration_hours'])if(values[key]!==undefined)values[key]=Number(values[key]);if(values.refrigerated!==undefined)values.refrigerated=values.refrigerated==='true';if(resource==='product_catalog')values.attributes=customAttributes;try{await api(`/mdm/${resource}`,{method:'POST',body:JSON.stringify(values)});close();await loadData();mdm();toast(resource==='product_catalog'?'Мол бо атрибутҳояш ба феҳрист илова шуд.':'Сабт ба маълумотнома илова шуд.');}catch(error){toast(error.message,true);}});
    }

    function createScene(container,config){
      const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(4.7,3.8,6.8);
      const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;container.appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xdce9dd,0x344239,2.1));const key=new THREE.DirectionalLight(0xffefd7,3.3);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const fill=new THREE.DirectionalLight(0x9ac4b0,1.5);fill.position.set(-5,2,-3);scene.add(fill);
      const floor=new THREE.Mesh(new THREE.CircleGeometry(3.1,64),new THREE.MeshStandardMaterial({color:0x29352d,roughness:.88}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.05;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(6,24,0x425147,0x344038);grid.position.y=-1.035;grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);
      const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=3;controls.maxDistance=12;controls.target.set(0,0,0);
      const context={scene,camera,renderer,controls,container,product:null,observer:null};updateScene(context,config);
      const resize=()=>{const rect=container.getBoundingClientRect();if(!rect.width||!rect.height)return;camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix();renderer.setSize(rect.width,rect.height,false);};context.observer=new ResizeObserver(resize);context.observer.observe(container);resize();
      const animate=()=>{if(!container.isConnected){context.observer.disconnect();renderer.dispose();return;}requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);};animate();return context;
    }
    function initScene(container,config,which){if(!container)return;if(which==='main'&&state.scene){state.scene.observer?.disconnect();state.scene.renderer.dispose();state.scene=null;}if(which==='mini'&&state.miniScene){state.miniScene.observer?.disconnect();state.miniScene.renderer.dispose();state.miniScene=null;}const scene=createScene(container,config);if(which==='main')state.scene=scene;else state.miniScene=scene;}
    function updateScene(context,config){
      if(!context)return;if(context.product){context.scene.remove(context.product);context.product.traverse(object=>{if(object.geometry)object.geometry.dispose();if(object.material){if(Array.isArray(object.material))object.material.forEach(material=>material.dispose());else object.material.dispose();}});}
      const group=new THREE.Group();const bodyColor=new THREE.Color(config.color||'#729c82');const capColor=new THREE.Color(config.capColor||'#d2a35e');const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,roughness:.31,metalness:.1,flatShading:config.shape==='faceted'});const capMat=new THREE.MeshStandardMaterial({color:capColor,roughness:.34});const metalMat=new THREE.MeshStandardMaterial({color:0xb5b7a9,metalness:.8,roughness:.22});const nibMat=new THREE.MeshStandardMaterial({color:0x252422,roughness:.65});const innerMat=new THREE.MeshStandardMaterial({color:0xe9e5d6,roughness:.8});
      const add=(geometry,material,x=0,y=0,z=0)=>{const object=new THREE.Mesh(geometry,material);object.position.set(x,y,z);object.castShadow=true;object.receiveShadow=true;group.add(object);return object;};
      const box=(width,height,depth,material,x=0,y=0,z=0)=>add(new THREE.BoxGeometry(width,height,depth),material,x,y,z);
      const cylinder=(top,bottom,height,material,y,segments=40)=>add(new THREE.CylinderGeometry(top,bottom,height,segments),material,0,y,0);
      const centimeters=value=>THREE.MathUtils.clamp(Number(value)||10,1,80)/10;
      const roundRect=(width,height,radius)=>{
        const shape=new THREE.Shape();shape.moveTo(-width/2+radius,-height/2);shape.lineTo(width/2-radius,-height/2);shape.quadraticCurveTo(width/2,-height/2,width/2,-height/2+radius);shape.lineTo(width/2,height/2-radius);shape.quadraticCurveTo(width/2,height/2,width/2-radius,height/2);shape.lineTo(-width/2+radius,height/2);shape.quadraticCurveTo(-width/2,height/2,-width/2,height/2-radius);shape.lineTo(-width/2,-height/2+radius);shape.quadraticCurveTo(-width/2,-height/2,-width/2+radius,-height/2);return shape;
      };
      if(config.type==='marker'){
        const segments=config.shape==='faceted'?8:48;const length=centimeters(config.length);const radius=THREE.MathUtils.clamp(Number(config.diameter)||1.8,1.2,2.8)/20;const bodyLength=length*.72;const tipLength=length*.17;const capLength=length*.23;const top=bodyLength/2;
        cylinder(radius*.96,radius,bodyLength,bodyMat,0,segments);
        cylinder(radius*.97,radius*.98,.045,metalMat,top-.012,segments);
        cylinder(radius*1.03,radius*1.03,capLength,capMat,top+capLength/2-.012,segments);
        const clip=box(radius*.3,capLength*.76,radius*.15,capMat,radius*.83,top+capLength*.56,0);
        const nibBase=-bodyLength/2; cylinder(radius*.7,radius*.8,.055,metalMat,nibBase+.012,segments);
        const nib=add(new THREE.ConeGeometry(radius*.72,tipLength,segments),innerMat,0,nibBase-tipLength/2+.015,0);nib.rotation.z=Math.PI;
        const core=add(new THREE.ConeGeometry(radius*.25,tipLength*.57,segments),nibMat,0,nibBase-tipLength*.6,0);core.rotation.z=Math.PI;
        group.rotation.z=-.12;
      }else if(config.type==='pen'||config.type==='pencil'){
        const pencil=config.type==='pencil';const length=centimeters(config.length_cm);const radius=THREE.MathUtils.clamp(Number(config.diameter_mm)||(pencil?7:1),pencil?5:.6,pencil?10:1.6)/20;
        const segments=pencil?(config.shape==='round'?40:config.shape==='triangular'?3:6):32;const shaftLength=length*.84;const shaftBottom=-shaftLength/2;const tipLength=length*.13;const top=shaftLength/2;
        cylinder(radius,radius,shaftLength,bodyMat,0,segments);
        const tip=add(new THREE.ConeGeometry(radius*.92,tipLength,segments),pencil?capMat:metalMat,0,shaftBottom-tipLength/2+.012,0);tip.rotation.z=Math.PI;
        if(pencil){
          const graphite=add(new THREE.ConeGeometry(radius*.13,tipLength*.22,segments),nibMat,0,shaftBottom-tipLength*.84,0);graphite.rotation.z=Math.PI;
          cylinder(radius*.96,radius*.9,length*.035,capMat,top+length*.018,segments);
        }else{
          const capLength=length*.17;
          cylinder(radius*1.05,radius*1.05,capLength,capMat,top+capLength/2,segments);
          box(radius*.35,capLength*.75,radius*.17,capMat,radius*.85,top+capLength*.55,0);
          cylinder(radius*.45,radius*.72,length*.1,metalMat,shaftBottom-length*.035,segments);
          const point=add(new THREE.ConeGeometry(radius*.45,length*.13,segments),metalMat,0,shaftBottom-length*.14,0);point.rotation.z=Math.PI;
          if(config.retractable==='click')cylinder(radius*.35,radius*.35,length*.07,metalMat,top+capLength+.025,segments);
        }
        group.rotation.z=-.12;
      }else if(config.type==='notebook'){
        const width=centimeters(config.width_cm);const height=centimeters(config.height_cm);const thickness=THREE.MathUtils.clamp(.12+Number(config.pages||48)/1800,.13,.36);
        box(width,height,thickness,capMat,0,0,0);
        box(width*.94,height*.96,thickness*.72,innerMat,0,0,thickness*.025);
        box(width*.91,height*.96,.035,bodyMat,0,0,thickness*.47);
        box(.045,height*.98,thickness*.82,metalMat,-width*.46,0,0);
        if(config.ruling!=='plain'){
          const lineMat=new THREE.MeshStandardMaterial({color:config.ruling==='grid'?0x98b6a1:0x9eb7ca,roughness:.8});
          for(let index=0;index<7;index++)box(width*.7,.009,.012,lineMat,0,-height*.36+index*height*.1,thickness*.5);
        }
      }else if(config.type==='folder'){
        const width=centimeters(config.width_cm);const height=centimeters(config.height_cm);const depth=THREE.MathUtils.clamp(Number(config.thickness_mm)||8,2,35)/100;
        const shape=new THREE.Shape();shape.moveTo(-width/2,-height/2);shape.lineTo(width/2,-height/2);shape.lineTo(width/2,height/2);shape.lineTo(width*.16,height/2);shape.lineTo(width*.08,height*.43);shape.lineTo(-width/2,height*.43);shape.closePath();
        const folder=new THREE.ExtrudeGeometry(shape,{depth:depth,bevelEnabled:false});folder.translate(0,0,-depth/2);add(folder,bodyMat);
        box(width*.86,.025,.015,capMat,0,height*.31,depth/2+.01);
      }else if(config.type==='bottle'){
        const height=centimeters(config.height_cm);const radius=centimeters(config.diameter_cm)/2;const neck=radius*.38;
        const points=[new THREE.Vector2(0,-height/2),new THREE.Vector2(radius*.76,-height/2),new THREE.Vector2(radius*.94,-height*.4),new THREE.Vector2(radius,-height*.25),new THREE.Vector2(radius,height*.25),new THREE.Vector2(radius*.9,height*.35),new THREE.Vector2(neck,height*.44),new THREE.Vector2(neck,height*.5)];
        const bottleMaterial=config.material==='glass'?new THREE.MeshPhysicalMaterial({color:bodyColor,roughness:.12,metalness:.03,transparent:true,opacity:.58}):bodyMat;
        add(new THREE.LatheGeometry(points,48),bottleMaterial);
        cylinder(neck*1.08,neck*1.08,height*.09,capMat,height*.53,32);
        cylinder(radius*.93,radius*.93,height*.13,capMat,height*.02,48);
      }else if(config.type==='box'){
        const width=centimeters(config.width_cm);const length=centimeters(config.length_cm);const height=centimeters(config.height_cm);
        box(width,height,length,bodyMat);
        box(width*.94,.025,length*.96,capMat,0,height/2+.015,0);
        box(width*.1,height*.035,length*.98,capMat,0,height/2+.025,0);
        box(width*.92,.025,.035,capMat,0,height/2+.025,length*.46);
      }else if(config.type==='ruler'){
        const length=centimeters(config.length_cm);const width=centimeters(config.width_cm);const baseY=.015;
        box(length,.04,width,bodyMat,0,baseY,0);
        const marks=new THREE.MeshStandardMaterial({color:0x27342d,roughness:.7});
        for(let index=0;index<=20;index++){
          const x=-length/2+length*index/20;const major=index%2===0;
          box(length/100,major?.012:.007,major?width*.38:width*.22,marks,x,baseY+.025,width*.28);
        }
      }else if(config.type==='eraser'||config.type==='soap'){
        const width=centimeters(config.width_cm);const length=centimeters(config.length_cm);const height=centimeters(config.type==='eraser'?config.thickness_cm:config.thickness_cm);
        const shape=roundRect(width,length,Math.min(width,length)*.14);
        const geometry=new THREE.ExtrudeGeometry(shape,{depth:height,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:Math.min(width,length,height)*.08,bevelThickness:Math.min(width,length,height)*.08});
        geometry.translate(0,0,-height/2);add(geometry,bodyMat);
        if(config.type==='soap')box(width*.55,.018,.02,capMat,0,length*.08,height/2+.05);
      }else if(config.type==='mug'){
        const height=centimeters(config.height_cm);const radius=centimeters(config.diameter_cm)/2;const wall=radius*.13;
        cylinder(radius*.98,radius,height,bodyMat,0,48);
        const inside=add(new THREE.CircleGeometry(radius-wall,40),nibMat,0,height*.45,0);inside.rotation.x=-Math.PI/2;
        const rim=add(new THREE.TorusGeometry(radius-wall/2,wall/2,12,48),capMat,0,height/2-.01,0);rim.rotation.x=Math.PI/2;
        const handle=add(new THREE.TorusGeometry(radius*.48,wall*.72,16,40),bodyMat,radius*1.18,0,0);
        handle.scale.set(1,1.15,1);
      }
      group.rotation.y=-.16;context.scene.add(group);context.product=group;
    }

    async function loadData(){state.data=await api('/bootstrap');}
    function navActive(){document.querySelectorAll('.nav-btn').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));}
    async function navigate(view){state.view=view;state.trackBarcode='';navActive();if(view==='dashboard')dashboard();if(view==='logistics')logistics();if(view==='tracking')await tracking();if(view==='mdm')mdm();}
    async function openTracking(value){state.trackBarcode=value;state.view='tracking';navActive();await tracking();}
    document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>navigate(button.dataset.view)));
    $('#today').textContent=new Date().toLocaleString('tg-TJ',{dateStyle:'medium'});
    try{await loadData();dashboard();}catch(error){$('#app-content').innerHTML=`<section class="panel" style="padding:24px"><div class="panel-title">Ба феҳрист пайваст нашуд</div><p class="hint">${esc(error.message)}. Барномаро бо uvicorn app:app --reload оғоз кунед.</p><button class="btn" onclick="location.reload()">Аз нав бор кардан</button></section>`;}
  </script>
