          <div class="modal-box" role="dialog" aria-modal="true" style="width:min(500px, 100%);">
            <div class="modal-head">
              <div style="font-weight:700; font-size:15px; color:#fff; display:flex; align-items:center; gap:8px;">
                <i data-lucide="users" width="18" style="color:var(--accent)"></i>
                <span>${isEdit ? 'Редактирование сотрудника' : 'Новый сотрудник предприятия'}</span>
              </div>
              <button class="btn btn-sm btn-icon" onclick="closeModal()"><i data-lucide="x" width="16"></i></button>
            </div>
            <form onsubmit="handleSaveStaff(event, ${staffId || 'null'})">
              <div class="modal-body" style="display:grid; gap:14px;">
                <div class="field">
                  <label>ФИО сотрудника *</label>
                  <input class="input" name="name" value="${esc(s ? s.name : '')}" placeholder="напр. Дилшод Саидов" required>
                </div>
                <div class="field">
                  <label>Должность / Специализация *</label>
                  <input class="input" name="role" list="staff-roles-list" value="${esc(s ? s.role : '')}" placeholder="Мастер цеха, Контролер ОТК, Логист..." required>
                  <datalist id="staff-roles-list">
                    <option value="Мастер раскройного цеха">
                    <option value="Мастер швейного цеха">
                    <option value="Контролер ОТК">
                    <option value="Начальник отдела контроля качества">
                    <option value="Главный технолог">
                    <option value="Старший кладовщик">
                    <option value="Оператор учета и маркировки">
                    <option value="Логист-диспетчер">
                    <option value="Водитель-экспедитор">
                  </datalist>
                </div>
                <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:12px;">
                  <div class="field">
                    <label>Номер телефона *</label>
                    <input class="input mono" name="phone" value="${esc(s ? s.phone : '+992 ')}" placeholder="+992 900 12 34 56" required>
                  </div>
                  <div class="field">
                    <label>Табельный № *</label>
                    <div style="display:flex; gap:6px;">
                      <input class="input mono" name="employee_no" id="staff-emp-input" value="${esc(s ? s.employee_no : autoEmpNo)}" required>
                      <button type="button" class="btn btn-sm" onclick="document.getElementById('staff-emp-input').value='TJ-EMP-'+Math.floor(Math.random()*900+100)">🎲</button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal()">Отмена</button>
                <button type="submit" class="btn btn-primary"><i data-lucide="check" width="14"></i>${isEdit ? 'Сохранить изменения' : 'Добавить сотрудника'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    async function handleSaveStaff(e, staffId) {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const payload = {
        name: fd.get('name').trim(),
        role: fd.get('role').trim(),
        phone: fd.get('phone').trim(),
        employee_no: fd.get('employee_no').trim(),
      };

      try {
        if (staffId) {
          await api(`/mdm/staff/${staffId}`, { method: 'PUT', body: JSON.stringify(payload) });
          toast('Данные сотрудника обновлены!', 'success');
        } else {
          await api('/mdm/staff', { method: 'POST', body: JSON.stringify(payload) });
          toast('Сотрудник успешно добавлен!', 'success');
        }
        closeModal();
        await loadData();
        await switchView(state.currentView);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function deleteStaff(staffId, name) {
      if (!confirm(`Вы действительно хотите удалить сотрудника "${name}"?`)) return;
      try {
        await api(`/mdm/staff/${staffId}`, { method: 'DELETE' });
        toast(`Сотрудник "${name}" удален!`, 'info');
        await loadData();
        await switchView(state.currentView);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // Modal 8: Create/Edit Vehicle
    function openVehicleModal(vehicleId = null) {
      const v = vehicleId ? state.data.vehicles.find(item => item.id === vehicleId) : null;
      const isEdit = !!v;

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-box" role="dialog" aria-modal="true" style="width:min(520px, 100%);">
            <div class="modal-head">
              <div style="font-weight:700; font-size:15px; color:#fff; display:flex; align-items:center; gap:8px;">
                <i data-lucide="truck" width="18" style="color:var(--primary)"></i>
                <span>${isEdit ? 'Редактирование транспорта' : 'Новое транспортное средство'}</span>
              </div>
              <button class="btn btn-sm btn-icon" onclick="closeModal()"><i data-lucide="x" width="16"></i></button>
            </div>
            <form onsubmit="handleSaveVehicle(event, ${vehicleId || 'null'})">
              <div class="modal-body" style="display:grid; gap:14px;">
                <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:12px;">
                  <div class="field">
                    <label>Госномер (Таджикистан) *</label>
                    <input class="input mono" name="plate" value="${esc(v ? v.plate : '')}" placeholder="напр. 01 555 TJ" required>
                  </div>
                  <div class="field">
                    <label>Марка / Модель *</label>
                    <input class="input" name="brand" list="vehicle-models-list" value="${esc(v ? v.brand : '')}" placeholder="Mercedes Sprinter, Isuzu..." required>
                    <datalist id="vehicle-models-list">
                      <option value="Mercedes-Benz Sprinter 316">
                      <option value="Hyundai Porter II">
                      <option value="Isuzu NPR 75">
                      <option value="Газель NEXT">
                      <option value="КамАЗ 5320 Изотерм">
                      <option value="MAN TGS 18.400">
                    </datalist>
                  </div>
                </div>
                <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:12px;">
                  <div class="field">
                    <label>Закрепленный водитель *</label>
                    <input class="input" name="driver" value="${esc(v ? v.driver : '')}" placeholder="напр. Фарход Назаров" required>
                  </div>
                  <div class="field">
                    <label>Телефон водителя *</label>
                    <input class="input mono" name="driver_phone" value="${esc(v ? v.driver_phone : '+992 ')}" placeholder="+992 918 55 44 33" required>
                  </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:center;">
                  <div class="field">
                    <label>Грузоподъемность (тонн) *</label>
                    <input class="input mono" type="number" step="0.1" min="0.1" name="capacity" value="${v ? v.capacity : '2.5'}" required>
                  </div>
                  <div class="switch-row" style="margin-top:20px;">
                    <div class="switch-info">
                      <div class="switch-title">Рефрижератор</div>
                      <div class="switch-desc">Холодная цепь / Термо</div>
                    </div>
                    <label class="switch">
                      <input type="checkbox" name="refrigerated" ${v && v.refrigerated ? 'checked' : ''}>
                      <span class="switch-slider"></span>
                    </label>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal()">Отмена</button>
                <button type="submit" class="btn btn-primary"><i data-lucide="check" width="14"></i>${isEdit ? 'Сохранить изменения' : 'Добавить транспорт'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    async function handleSaveVehicle(e, vehicleId) {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const payload = {
        plate: fd.get('plate').trim(),
        brand: fd.get('brand').trim(),
        driver: fd.get('driver').trim(),
        driver_phone: fd.get('driver_phone').trim(),
        capacity: parseFloat(fd.get('capacity')) || 1.0,
        refrigerated: form.elements['refrigerated']?.checked ?? false,
      };

      try {
        if (vehicleId) {
          await api(`/mdm/vehicles/${vehicleId}`, { method: 'PUT', body: JSON.stringify(payload) });
          toast('Данные транспорта обновлены!', 'success');
        } else {
          await api('/mdm/vehicles', { method: 'POST', body: JSON.stringify(payload) });
          toast('Транспорт успешно добавлен в автопарк!', 'success');
        }
        closeModal();
        await loadData();
        await switchView(state.currentView);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function deleteVehicle(vehicleId, plate) {
      if (!confirm(`Вы действительно хотите удалить транспорт "${plate}"?`)) return;
      try {
        await api(`/mdm/vehicles/${vehicleId}`, { method: 'DELETE' });
        toast(`Транспорт "${plate}" удален!`, 'info');
        await loadData();
        await switchView(state.currentView);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // Modal 9: Create/Edit Route
    function openRouteModal(routeId = null) {
      const r = routeId ? state.data.routes.find(item => item.id === routeId) : null;
      const isEdit = !!r;

      document.getElementById('modal-container').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal-box" role="dialog" aria-modal="true" style="width:min(500px, 100%);">
            <div class="modal-head">
              <div style="font-weight:700; font-size:15px; color:#fff; display:flex; align-items:center; gap:8px;">
                <i data-lucide="milestone" width="18" style="color:var(--primary)"></i>
                <span>${isEdit ? 'Редактирование маршрута' : 'Новый логистический маршрут'}</span>
              </div>
              <button class="btn btn-sm btn-icon" onclick="closeModal()"><i data-lucide="x" width="16"></i></button>
            </div>
            <form onsubmit="handleSaveRoute(event, ${routeId || 'null'})">
              <div class="modal-body" style="display:grid; gap:14px;">
                <div class="field">
                  <label>Название / Направление маршрута *</label>
                  <input class="input" name="name" value="${esc(r ? r.name : '')}" placeholder="напр. Душанбе — Худжанд (трасса М34)" required>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                  <div class="field">
                    <label>Пункт отправления *</label>
                    <input class="input" name="origin" list="tj-cities-list" value="${esc(r ? r.origin : 'Душанбе')}" placeholder="Душанбе, Худжанд..." required>
                  </div>
                  <div class="field">
                    <label>Пункт назначения *</label>
                    <input class="input" name="destination" list="tj-cities-list" value="${esc(r ? r.destination : 'Худжанд')}" placeholder="Худжанд, Бохтар..." required>
                  </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                  <div class="field">
                    <label>Расстояние (км) *</label>
                    <input class="input mono" type="number" step="1" min="1" name="distance_km" value="${r ? r.distance_km : '300'}" required>
                  </div>
                  <div class="field">
                    <label>Время в пути (часов) *</label>
                    <input class="input mono" type="number" step="0.5" min="0.5" name="duration_hours" value="${r ? r.duration_hours : '5.5'}" required>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn" onclick="closeModal()">Отмена</button>
                <button type="submit" class="btn btn-primary"><i data-lucide="check" width="14"></i>${isEdit ? 'Сохранить изменения' : 'Создать маршрут'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }

    async function handleSaveRoute(e, routeId) {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const payload = {
        name: fd.get('name').trim(),
        origin: fd.get('origin').trim(),
        destination: fd.get('destination').trim(),
        distance_km: parseFloat(fd.get('distance_km')) || 10,
        duration_hours: parseFloat(fd.get('duration_hours')) || 1,
      };

      try {
        if (routeId) {
          await api(`/mdm/routes/${routeId}`, { method: 'PUT', body: JSON.stringify(payload) });
          toast('Данные маршрута обновлены!', 'success');
        } else {
          await api('/mdm/routes', { method: 'POST', body: JSON.stringify(payload) });
          toast('Маршрут успешно добавлен в справочник!', 'success');
        }
        closeModal();
        await loadData();
        await switchView(state.currentView);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    async function deleteRoute(routeId, name) {
      if (!confirm(`Вы действительно хотите удалить маршрут "${name}"?`)) return;
      try {
        await api(`/mdm/routes/${routeId}`, { method: 'DELETE' });
        toast(`Маршрут "${name}" удален!`, 'info');
        await loadData();
        await switchView(state.currentView);
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    // --- Init & Event Listeners ---
    document.querySelectorAll('.nav-item').forEach(button => {
      button.addEventListener('click', () => switchView(button.dataset.view));
    });

    document.getElementById('btn-open-create-product').addEventListener('click', openCreateProductModal);
    document.getElementById('btn-open-move-modal').addEventListener('click', () => openMoveModal());

    document.getElementById('quick-track-form').addEventListener('submit', e => {
      e.preventDefault();
      const val = document.getElementById('quick-track-input').value.trim();
      if (val) trackBarcode(val);
    });

    // Start App
    (async function init() {
      initTheme();
      await loadData();
      switchView('dashboard');
    })();
  </script>
</body>
